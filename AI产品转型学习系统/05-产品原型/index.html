<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>合规工作台 · AI Compliance Check Assistant</title>
<style>
  :root {
    --bg: #f5f7fb; --card: #fff; --line: #e5e7eb; --text: #1f2937; --muted: #6b7280;
    --blue: #2563eb; --green: #047857; --orange: #b45309; --red: #b91c1c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif; line-height: 1.6; }
  .wrap { max-width: 980px; margin: 0 auto; }
  .hero { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; margin-bottom: 18px; }
  .hero h1 { margin: 0 0 6px; font-size: 24px; }
  .hero p { margin: 0; color: var(--muted); font-size: 14px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 16px; }
  .tab-btn { border: 1px solid var(--line); background: var(--card); color: var(--muted);
    border-radius: 10px; padding: 8px 16px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .tab-btn.active { background: var(--blue); color: #fff; border-color: var(--blue); }
  .panel { display: none; }
  .panel.active { display: block; }
  .toolbar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  button { border: none; border-radius: 10px; padding: 10px 16px; font-size: 14px; font-weight: 600;
    cursor: pointer; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-primary { background: var(--blue); color: #fff; }
  .btn-secondary { background: #eef2ff; color: #3730a3; }
  .btn-danger { background: #fef2f2; color: var(--red); }
  .btn-primary:hover, .btn-secondary:hover, .btn-danger:hover { opacity: 0.85; }
  .status { font-size: 13px; color: var(--muted); }
  .status.ok { color: var(--green); }
  .status.err { color: var(--red); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 14px; }
  .card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
  .card-head .id-badge { display: inline-block; background: #eef2ff; color: #3730a3; border-radius: 999px;
    padding: 3px 10px; font-size: 12px; font-weight: 700; margin-right: 8px; }
  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; font-weight: 600; }
  .field input, .field select, .field textarea { width: 100%; border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 10px; font-size: 14px; font-family: inherit; }
  .field textarea { min-height: 64px; resize: vertical; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .card-actions { display: flex; gap: 8px; margin-top: 10px; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .action-space-note { font-size: 12px; color: var(--muted); margin-bottom: 14px; }
  #loading { color: var(--muted); padding: 20px; }

  .run-form { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 10px; }
  .run-form .field { margin-bottom: 0; min-width: 220px; }
  .run-form .field.narrow { min-width: 100px; }
  .llm-note { font-size: 13px; margin-bottom: 14px; }
  .llm-note.ok { color: var(--green); }
  .llm-note.err { color: var(--red); }
  .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .metric { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
  .metric .label { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .metric .value { font-size: 20px; font-weight: 700; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; }
  .tag { display: inline-block; border-radius: 999px; padding: 2px 8px; font-size: 12px; font-weight: 700; }
  .tag-fail { background: #fef2f2; color: var(--red); }
  .tag-error { background: #fffbeb; color: var(--orange); }
  #runStatus { margin-bottom: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>合规工作台</h1>
    <p>AI Compliance Check Assistant · 本地个人工具，两个模块共用同一个后端：规则配置负责"改规则"，规则执行负责"跑评测、看命中结果"。</p>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="rules" onclick="switchTab('rules')">① 规则配置</button>
    <button class="tab-btn" data-tab="run" onclick="switchTab('run')">② 规则执行</button>
  </div>

  <!-- ============ Tab 1: 规则配置 ============ -->
  <div class="panel active" id="panel-rules">
    <div class="toolbar">
      <button class="btn-secondary" onclick="addCategory()">+ 新增类目</button>
      <button class="btn-primary" onclick="saveAll()">保存全部改动</button>
      <span id="rulesStatus" class="status"></span>
    </div>
    <div class="action-space-note" id="actionSpaceNote"></div>

    <div id="rulesLoading">加载中…</div>
    <div id="cards"></div>
  </div>

  <!-- ============ Tab 2: 规则执行 ============ -->
  <div class="panel" id="panel-run">
    <div class="card">
      <div id="llmNote" class="llm-note">检查 LLM key 配置中…</div>
      <div class="run-form">
        <div class="field">
          <label>数据集</label>
          <select id="datasetSelect" onchange="onDatasetChange()">
            <option value="mvp">MVP子集</option>
            <option value="csv50">完整CSV50</option>
            <option value="custom">自定义路径（比如300 case）</option>
          </select>
        </div>
        <div class="field" id="customPathField" style="display:none;">
          <label>CSV文件绝对路径</label>
          <input type="text" id="customPathInput" placeholder="/Users/.../300case.csv">
        </div>
        <div class="field narrow">
          <label>并发数（默认1）</label>
          <input type="number" id="workersInput" min="1" max="8" value="1">
        </div>
        <button class="btn-primary" id="runBtn" onclick="runEval()">运行评测</button>
      </div>
      <div class="hint" id="datasetHint"></div>
    </div>

    <div id="runStatus" class="status"></div>
    <div id="runResults"></div>
  </div>
</div>

<script>
let state = null; // 完整的 rules_config.json 内容

/* ---------- Tab 切换 ---------- */
function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.getElementById('panel-rules').classList.toggle('active', tab === 'rules');
  document.getElementById('panel-run').classList.toggle('active', tab === 'run');
  if (tab === 'run' && !window.__datasetsLoaded) loadDatasets();
}

/* ---------- Tab 1: 规则配置（逻辑不变，从旧版原样搬过来） ---------- */
async function loadRules() {
  const res = await fetch('/api/rules');
  state = await res.json();
  document.getElementById('rulesLoading').style.display = 'none';
  document.getElementById('actionSpaceNote').textContent =
    '当前允许的动作（action_space）：' + (state.action_space || []).join(' / ') +
    '　默认通过类目：' + state.default_rule_id;
  render();
}

function render() {
  const container = document.getElementById('cards');
  container.innerHTML = '';
  const ids = Object.keys(state.categories).sort();
  ids.forEach(id => container.appendChild(renderCard(id)));
}

function renderCard(id) {
  const cat = state.categories[id];
  const div = document.createElement('div');
  div.className = 'card';
  div.innerHTML = `
    <div class="card-head">
      <div><span class="id-badge">${id}</span><strong>${escapeHtml(cat.name || '')}</strong></div>
    </div>
    <div class="row">
      <div class="field">
        <label>规则名称</label>
        <input type="text" data-field="name" value="${escapeAttr(cat.name || '')}">
      </div>
      <div class="field">
        <label>风险等级</label>
        <select data-field="risk_level">
          ${['Critical','Medium','Low'].map(r => `<option value="${r}" ${cat.risk_level===r?'selected':''}>${r}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="field">
      <label>命中后动作</label>
      <select data-field="action">
        ${(state.action_space || []).map(a => `<option value="${a}" ${cat.action===a?'selected':''}>${a}</option>`).join('')}
      </select>
    </div>
    <div class="field">
      <label>规则说明（description，纯自然语言，这是LLM判断的主要依据）</label>
      <textarea data-field="description">${escapeHtml(cat.description || '')}</textarea>
    </div>
    <div class="field">
      <label>违规示例（examples，每行一条）</label>
      <textarea data-field="examples">${escapeHtml((cat.examples || []).join('\\n'))}</textarea>
      <div class="hint">典型的、明确命中这条规则的例句，帮LLM建立"什么样算违规"的感觉</div>
    </div>
    <div class="field">
      <label>边界示例（boundary_examples，每行一条）</label>
      <textarea data-field="boundary_examples">${escapeHtml((cat.boundary_examples || []).join('\\n'))}</textarea>
      <div class="hint">看起来沾边、但其实不应该命中这条规则的例句，帮LLM避免误判/误伤</div>
    </div>
    <div class="card-actions">
      <button class="btn-danger" onclick="deleteCategory('${id}')">删除此类目</button>
    </div>
  `;
  div.querySelectorAll('[data-field]').forEach(el => {
    el.addEventListener('input', () => syncFieldToState(id, el));
  });
  return div;
}

function syncFieldToState(id, el) {
  const field = el.dataset.field;
  if (field === 'examples' || field === 'boundary_examples') {
    state.categories[id][field] = el.value.split('\n').map(s => s.trim()).filter(Boolean);
  } else {
    state.categories[id][field] = el.value;
  }
}

function addCategory() {
  const id = prompt('新类目的编号（比如 09，两位数字）：');
  if (!id) return;
  if (state.categories[id]) { alert('这个编号已经存在了'); return; }
  state.categories[id] = {
    name: '新规则',
    risk_level: 'Medium',
    action: state.action_space && state.action_space[1] || 'PassWithNotice',
    description: '',
    examples: [],
    boundary_examples: []
  };
  render();
}

function deleteCategory(id) {
  if (!confirm(`确定要删除类目 ${id}（${state.categories[id].name}）吗？`)) return;
  delete state.categories[id];
  render();
}

async function saveAll() {
  const statusEl = document.getElementById('rulesStatus');
  statusEl.textContent = '保存中…';
  statusEl.className = 'status';
  try {
    const res = await fetch('/api/rules', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(state)
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '保存失败');
    statusEl.textContent = '已保存 ' + new Date().toLocaleTimeString();
    statusEl.className = 'status ok';
  } catch (e) {
    statusEl.textContent = '保存失败：' + e.message;
    statusEl.className = 'status err';
  }
}

/* ---------- Tab 2: 规则执行 ---------- */
async function loadDatasets() {
  window.__datasetsLoaded = true;
  const llmNote = document.getElementById('llmNote');
  try {
    const res = await fetch('/api/datasets');
    const data = await res.json();
    if (data.has_api_key) {
      llmNote.textContent = '当前 LLM 运行时：' + data.llm_runtime;
      llmNote.className = 'llm-note ok';
    } else {
      llmNote.textContent = '没有检测到 LLM key：请停掉 server.py，在终端里 export DEEPSEEK_API_KEY="你的key" 后重新启动';
      llmNote.className = 'llm-note err';
    }
    const csv50 = data.presets.find(p => p.key === 'csv50');
    document.getElementById('datasetHint').textContent =
      csv50 && !csv50.exists ? `注意：默认CSV50路径不存在（${csv50.path}）` : '';
  } catch (e) {
    llmNote.textContent = '检查失败：' + e.message;
    llmNote.className = 'llm-note err';
  }
}

function onDatasetChange() {
  const isCustom = document.getElementById('datasetSelect').value === 'custom';
  document.getElementById('customPathField').style.display = isCustom ? 'block' : 'none';
}

async function runEval() {
  const dataset = document.getElementById('datasetSelect').value;
  const customPath = document.getElementById('customPathInput').value.trim();
  const workers = parseInt(document.getElementById('workersInput').value, 10) || 1;
  const runBtn = document.getElementById('runBtn');
  const statusEl = document.getElementById('runStatus');
  const resultsEl = document.getElementById('runResults');

  if (dataset === 'custom' && !customPath) {
    statusEl.textContent = '请先填写自定义数据集的文件路径';
    statusEl.className = 'status err';
    return;
  }

  runBtn.disabled = true;
  statusEl.textContent = '运行中…数据集越大越慢，CSV50/300 case 可能要几分钟，请耐心等待';
  statusEl.className = 'status';
  resultsEl.innerHTML = '';

  try {
    const res = await fetch('/api/run', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ dataset, custom_path: customPath || null, workers })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '运行失败');
    statusEl.textContent = `完成：${data.dataset_label}　结果已保存到 ${data.results_file}`;
    statusEl.className = 'status ok';
    renderResults(data);
  } catch (e) {
    statusEl.textContent = '运行失败：' + e.message;
    statusEl.className = 'status err';
  } finally {
    runBtn.disabled = false;
  }
}

function renderResults(data) {
  const s = data.summary;
  const pct = v => (v === null || v === undefined) ? '-' : (v * 100).toFixed(0) + '%';
  const metricsHtml = `
    <div class="metrics">
      <div class="metric"><div class="label">总用例数</div><div class="value">${s.total}</div></div>
      <div class="metric"><div class="label">成功跑完 / 报错</div><div class="value">${s.tested} / ${s.errored}</div></div>
      <div class="metric"><div class="label">整体类别准确率</div><div class="value">${pct(s.overall_exact_category_accuracy)}</div></div>
      <div class="metric"><div class="label">高危类 Recall</div><div class="value">${pct(s.critical_recall_release_gate)}</div></div>
      <div class="metric"><div class="label">中危类 Precision</div><div class="value">${pct(s.medium_precision_release_gate)}</div></div>
      <div class="metric"><div class="label">低危误报率</div><div class="value">${pct(s.low_false_positive_rate_release_gate)}</div></div>
    </div>
  `;

  const failedAndErrored = data.results.filter(r => !r.exact_category || r.status !== 'OK');
  let tableHtml = '<div class="card"><strong>失败 / 报错详情（' + failedAndErrored.length + ' 条）</strong>';
  if (failedAndErrored.length) {
    tableHtml += `
      <table>
        <thead><tr><th>ID</th><th>输入</th><th>期望</th><th>实际</th><th>状态</th></tr></thead>
        <tbody>
          ${failedAndErrored.slice(0, 50).map(r => `
            <tr>
              <td>${escapeHtml(r.id || '')}</td>
              <td>${escapeHtml((r.text || '').slice(0, 40))}</td>
              <td>${escapeHtml(r.expected_category || '')}</td>
              <td>${escapeHtml(r.actual_category || '-')}</td>
              <td>${r.status === 'OK'
                ? '<span class="tag tag-fail">类别不符</span>'
                : `<span class="tag tag-error">${escapeHtml(r.status)}</span>`}</td>
            </tr>
          `).join('')}
        </tbody>
      </table>
      ${failedAndErrored.length > 50 ? `<div class="hint">只显示前50条，完整结果见 ${escapeHtml(data.results_file || '')}</div>` : ''}
    `;
  } else {
    tableHtml += '<div class="hint">全部通过，没有失败或报错的case</div>';
  }
  tableHtml += '</div>';

  document.getElementById('runResults').innerHTML = metricsHtml + tableHtml;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
}
function escapeAttr(s) {
  return escapeHtml(s).replace(/"/g, '&quot;');
}

loadRules();
</script>
</body>
</html>
